# Obsidian Master Kit Workflow Add New Skill Or Feature Module

## Action

Follow the add-new-skill-or-feature-module workflow:
1. Create or update SKILL.md with frontmatter and usage documentation.
2. Implement initial CLI or script file(s) with argparse or similar stub logic.
3. Add or update core utility modules as needed for shared functionality.
4. Write initial test files covering CLI, argument parsing, and core logic.
5. Verify regression tests and code coverage.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: skills/<skill-name>/SKILL.md, skills/<skill-name>/scripts/<feature>.py, core/<utility>.py

